<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>白嫖 API 速查</title>
  <meta name="description" content="每日验证 · 死链可见 · 额度横向可比。收录可注册、可签到、可生图和长期备用的免费 AI API 站点。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="白嫖 API 速查" />
  <meta property="og:description" content="每日验证 · 死链可见 · 额度横向可比。免费 AI API 站点导航。" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23087f78'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('broadcast-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          return;
        }
      } catch (e) {}
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主要内容</a>
  <main class="page-shell" id="main-content">
    <section class="hero-band" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <div class="hero-title-row">
          <h1 id="pageTitle">今天还有哪些 AI API 能白嫖？</h1>
          <div class="hero-cta-group">
            <button class="cta-button cta-primary" id="heroPresetBtn" type="button" data-preset="high">⭐ 查看高额度</button>
            <button class="cta-button cta-secondary" id="submitSiteBtn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              提交站点
            </button>
          </div>
        </div>
        <p class="intro">
          每日验证 · 死链可见 · 额度横向可比。免费 AI API 站点导航。
        </p>
      </div>
      <div class="theme-switcher" role="group" aria-label="主题模式">
        <button class="theme-button" type="button" data-theme-choice="light" aria-label="亮色主题" aria-pressed="false" title="亮色主题">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </button>
        <button class="theme-button" type="button" data-theme-choice="dark" aria-label="暗色主题" aria-pressed="false" title="暗色主题">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12.6A8.5 8.5 0 1 1 11.4 3 6.5 6.5 0 0 0 21 12.6z" />
          </svg>
        </button>
        <button class="theme-button" type="button" data-theme-choice="system" aria-label="跟随系统" aria-pressed="false" title="跟随系统">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8" />
            <path d="M12 16v4" />
          </svg>
        </button>
      </div>
    </section>

    <section class="toolbar" aria-label="筛选站点">
      <div class="summary-strip" id="summaryStrip"></div>
    </section>

    <nav class="filter-row" id="filterRow" aria-label="标签筛选"></nav>

    <section class="notice-band" id="noticeBand" hidden>
      <div>
        <p class="notice-title">公告</p>
        <div class="notice-content" id="noticeContent"></div>
      </div>
    </section>

    <section class="cards-area" id="cardsArea" aria-label="站点列表"></section>
  </main>

  <!-- ═══════ 提交站点模态框 ═══════ -->
  <dialog id="submitModal" class="submit-modal">
    <form id="submitForm" method="dialog">
      <div class="submit-header">
        <h2>📝 提交新站点</h2>
        <button type="button" class="submit-close" onclick="document.getElementById('submitModal').close()" aria-label="关闭">&times;</button>
      </div>
      <p class="submit-hint">提交后由管理员审核，审核通过后自动上线。每天最多提交 5 个站点。</p>
      <div class="submit-field">
        <label for="submitName">站点名称 *</label>
        <input id="submitName" required placeholder="如：NewAI" maxlength="60">
      </div>
      <div class="submit-field">
        <label for="submitUrl">站点 URL *</label>
        <input id="submitUrl" required type="url" placeholder="https://example.com">
      </div>
      <div class="submit-field">
        <label for="submitTags">标签（逗号分隔）</label>
        <input id="submitTags" placeholder="签到, 生图, 限免">
      </div>
      <div class="submit-field">
        <label for="submitSummary">站点简介</label>
        <textarea id="submitSummary" rows="2" maxlength="200" placeholder="一句话描述站点特色"></textarea>
      </div>
      <div class="submit-field">
        <label for="submitCheckin">签到额度</label>
        <input id="submitCheckin" placeholder="如：每日签到 5-50 刀">
      </div>
      <div class="submit-field">
        <label for="submitModels">支持模型</label>
        <input id="submitModels" placeholder="如：Claude Opus 5、GPT-5.6">
      </div>
      <div class="submit-field">
        <label for="submitRegister">注册方式</label>
        <input id="submitRegister" placeholder="如：GitHub、邮箱">
      </div>
      <div class="submit-actions">
        <button type="button" class="submit-btn-cancel" onclick="document.getElementById('submitModal').close()">取消</button>
        <button type="submit" class="submit-btn-confirm" id="submitConfirmBtn">提交审核</button>
      </div>
    </form>
  </dialog>

  <!-- ═══════ 反馈模态框 ═══════ -->
  <dialog id="feedbackModal" class="feedback-modal">
    <form id="feedbackForm" method="dialog">
      <div class="feedback-header">
        <h2>💬 反馈站点信息</h2>
        <button type="button" class="feedback-close" onclick="document.getElementById('feedbackModal').close()" aria-label="关闭">&times;</button>
      </div>
      <p class="feedback-site-name" id="feedbackSiteName"></p>
      <div class="feedback-field">
        <label>反馈类型 *</label>
        <div class="feedback-type-group" id="feedbackTypeGroup">
          <button type="button" class="feedback-type-btn" data-fb-type="error">🐛 报错</button>
          <button type="button" class="feedback-type-btn" data-fb-type="correction">✏️ 纠正</button>
          <button type="button" class="feedback-type-btn" data-fb-type="positive">👍 好评</button>
        </div>
      </div>
      <div class="feedback-field">
        <label for="feedbackContent">反馈内容 *</label>
        <textarea id="feedbackContent" rows="3" maxlength="500" placeholder="请描述您发现的问题或建议..." required></textarea>
        <div class="feedback-hint"><span id="feedbackCharCount">0</span>/500</div>
      </div>
      <div class="feedback-actions">
        <button type="button" class="feedback-btn-cancel" onclick="document.getElementById('feedbackModal').close()">取消</button>
        <button type="submit" class="feedback-btn-confirm" id="feedbackConfirmBtn">提交反馈</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
